name: Publish package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: |
          npm config set //nexus.romni.io/repository/npm-local/:_auth "$(printf %s "$NEXUS_USERNAME:$NEXUS_PASSWORD" | base64 -w 0)"
          npm whoami --registry=https://nexus.romni.io/repository/npm-local/
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      - run: pnpm publish --no-git-checks
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rev-parse "v${{ steps.package.outputs.version }}" >/dev/null 2>&1 || git tag "v${{ steps.package.outputs.version }}" "$GITHUB_SHA"
          pnpm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore: prepare next patch version"
          git push --atomic origin HEAD:main "v${{ steps.package.outputs.version }}"
