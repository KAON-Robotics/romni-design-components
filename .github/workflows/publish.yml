name: Publish package

on:
  push:
    # branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://nexus.romni.io/repository/npm-local/
      - run: |
          echo "===== ~/.npmrc ====="
          cat ~/.npmrc      
      - run: |
          pnpm -v
          pnpm install --frozen-lockfile
      - run: pnpm check
      - id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: |
          echo "Token length: ${#NODE_AUTH_TOKEN}"
          printf %s "$NODE_AUTH_TOKEN" | sha256sum
        
      - run: PNPM_LOG_LEVEL=debug pnpm publish --no-git-checks

      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rev-parse "v${{ steps.package.outputs.version }}" >/dev/null 2>&1 || git tag "v${{ steps.package.outputs.version }}" "$GITHUB_SHA"
          pnpm version patch --no-git-tag-version
          git add package.json
          git commit -m "chore: prepare next patch version"
          git push --atomic origin HEAD:main "v${{ steps.package.outputs.version }}"
        if: github.ref_name == 'main'